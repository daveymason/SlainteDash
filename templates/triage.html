<div class="container-fluid px-0">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
        <div>
            <h2 class="h4 fw-bold text-dark mb-1">
                <i class="fas fa-heartbeat text-danger me-2"></i>Live Manchester Triage Queue
            </h2>
            <p class="text-muted small mb-0">Deterministic Manchester Triage System (MTS Cat 1&ndash;5) &amp; RCP NEWS2 acuity stream.</p>
        </div>
        <div class="d-flex flex-wrap gap-2">
            <button type="button" class="btn btn-primary btn-sm fw-semibold"
                    data-bs-toggle="modal" data-bs-target="#patientIntakeModal">
                <i class="fas fa-user-plus me-1"></i> Patient Intake
            </button>
            <a href="/?view=agent_multimodal_ingest"
               class="btn btn-outline-secondary btn-sm"
               hx-get="/fhir/Agent/multimodal_ingest"
               hx-push-url="/?view=agent_multimodal_ingest"
               hx-target="#content">
                <i class="fas fa-file-medical me-1"></i> Agent 06: Ingestion
            </a>
            <button class="btn btn-outline-primary btn-sm"
                    hx-get="/fhir/triage_fragment"
                    hx-target="#triage-queue-content"
                    hx-swap="outerHTML">
                <i class="fas fa-redo me-1"></i> Refresh Now
            </button>
        </div>
    </div>

    <!-- Live Queue Fragment with HTMX Polling -->
    {% include 'triage_fragment.html' %}
</div>
