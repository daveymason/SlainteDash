<div class="container-fluid px-0">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="text-primary mb-1">
                <i class="fas fa-heartbeat text-danger me-2"></i>Live Manchester Triage Queue
            </h2>
            <p class="text-muted mb-0">Autonomous clinical ingestion stream with deterministic Manchester Triage System (MTS) acuity allocation.</p>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-outline-secondary btn-sm"
                    hx-get="/pipeline/status"
                    hx-target="#content">
                <i class="fas fa-cogs me-1"></i> Pipeline Status
            </button>
            <button class="btn btn-outline-primary btn-sm"
                    hx-get="/fhir/triage_fragment"
                    hx-target="#triage-queue-content"
                    hx-swap="outerHTML">
                <i class="fas fa-redo me-1"></i> Refresh Now
            </button>
        </div>
    </div>

    <!-- Live Queue Fragment with HTMX Polling (Includes Quick Stats Cards) -->
    {% include 'triage_fragment.html' %}
</div>
